    <title>Opening Vibely…</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0d1117;
            color:#e6edf3;
            font-family:system-ui,sans-serif;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            padding:24px;
            text-align:center;
        }

        .logo{
            width:90px;
            height:90px;
            margin-bottom:20px;
        }

        .logo img{
            width:100%;
            height:100%;
            object-fit:contain;
        }

        h1{
            font-size:20px;
            font-weight:600;
            margin-bottom:8px;
        }

        p{
            font-size:14px;
            color:#8b949e;
            margin-bottom:28px;
            line-height:1.6;
        }

        .btn{
            display:inline-block;
            background:#e5c687;
            color:#000;
            font-weight:700;
            font-size:15px;
            padding:13px 30px;
            border-radius:50px;
            text-decoration:none;
            margin-bottom:14px;
            cursor:pointer;
            border:none;
        }

        .hint{
            font-size:12px;
            color:#6e7681;
        }

        .hint a{
            color:#58a6ff;
        }

        #cd{
            color:#e5c687;
            font-weight:600;
        }
    </style>
</head>

<body>

<div class="logo">
    <img src="https://fknnuvgevetfofnewwbm.supabase.co/storage/v1/object/sign/app_icon/app_icon.png?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV9iZjVlZmY4Ni1mYjk0LTQwMGUtYjM3Zi02NTZhNjc2NjkzMzkiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJhcHBfaWNvbi9hcHBfaWNvbi5wbmciLCJpYXQiOjE3NzkzMjgxNzYsImV4cCI6NDkzMjkyODE3Nn0.zAEhNQCkDvo5vtUhlkwm9gIHNN2tbamKswYNX7iVz4g"
         alt="Vibely Logo">
</div>

<h1>Opening in Vibely…</h1>

<p>
    If the app doesn't open automatically,<br>
    tap the button below.<br>
    <span id="cd"></span>
</p>

<button class="btn" id="openBtn">Open in Vibely</button>

<p class="hint" id="dl" style="display:none">
    Don't have Vibely?
    <a href="https://play.google.com/store/apps/details?id=com.example.chat_app_firebase">
        Download on Android
    </a>
</p>

<script>
    const parts = window.location.pathname.split('/').filter(Boolean);
    const postId = parts[parts.length - 1] || '';
    const deepLink = 'vibely://post/' + postId;

    window.location.href = deepLink;

    document.getElementById('openBtn').addEventListener('click', function () {
        window.location.href = deepLink;
    });

    let secs = 3;
    const cd = document.getElementById('cd');
    const dl = document.getElementById('dl');

    const timer = setInterval(function () {
        secs--;
        if (secs > 0) {
            cd.textContent = 'Redirecting in ' + secs + '…';
        } else {
            clearInterval(timer);
            cd.textContent = '';
            dl.style.display = 'block';
        }
    }, 1000);

    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            clearInterval(timer);
            cd.textContent = '';
        }
    });
</script>

</body>
</html>
