name: vibely
description: "Vibely — connect, share, vibe."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.9.1
  material_symbols_icons: ^4.2892.0
  smooth_page_indicator: ^1.1.0
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  intl_phone_field: ^3.2.0

  # State management
  flutter_bloc: ^9.1.1

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.2.0
  firebase_analytics: ^12.4.1
  firebase_crashlytics: ^5.2.2
  cloud_functions: ^6.3.1
  # firebase_storage kept for backward compat — new uploads go via Supabase
  firebase_storage: ^13.0.5
  firebase_database: ^12.0.3

  # Supabase (primary file storage)
  supabase: ^2.10.2
  supabase_flutter: ^2.12.0

  # Storage / prefs
  shared_preferences: ^2.5.3

  # Media
  image_picker: ^1.2.1
  video_player: ^2.10.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  video_thumbnail: ^0.5.6
  flutter_image_compress: ^2.4.0
  visibility_detector: ^0.4.0+2
  just_audio: ^0.9.40
  flutter_sound: ^9.2.13

  # Notifications
  flutter_local_notifications: ^20.1.0
  googleapis_auth: ^2.0.0

  # Networking / utils
  http: ^1.6.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.1
  app_links: ^6.4.1
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  device_info_plus: ^12.4.0
  uuid: ^4.5.3
  intl: ^0.20.2
  collection: ^1.18.0
  scrollable_positioned_list: ^0.3.8

  # Misc
  fluttertoast: ^9.0.0
  conditional_builder_null_safety: ^0.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  # FIX: mocktail and bloc_test were incorrectly in `dependencies` (shipped in release APK).
  # Moved here so they are excluded from production builds.
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/app_icon.png"
  adaptive_icon_background: "#0d1117"
  adaptive_icon_foreground: "assets/app_icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/app_icon/app_icon.png
    - assets/app_icon/innova.png
    - assets/app_icon/innova_dark.png
    - assets/images/default_avatar.png
